<!DOCTYPE html>
<html>
<head>
  <title>AR Game Fluida</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #E0F2FE; }
    .ui-container { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 100; }
    .question-box { background: rgba(255, 255, 255, 0.95); border: 4px solid #60A5FA; border-radius: 24px; display: inline-block; padding: 20px 30px; max-width: 80%; box-shadow: 0px 10px 20px rgba(0,0,0,0.15); }
    h2 { margin: 0; color: #1E3A8A; font-size: 22px; line-height: 1.4; }
    .level-badge { background:#3B82F6; color:white; padding:6px 14px; border-radius:12px; display:inline-block; margin-bottom:10px; font-weight:bold; font-size: 14px; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); }
    .q-type { color:#6B7280; font-size: 15px; margin-top:8px; font-weight: 600; }
    
    .feedback-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 24px; z-index: 200; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); width: 75%; text-align: center; border: 4px solid #EF4444;}
    .feedback-title { color: #EF4444; font-size: 28px; margin:0 0 15px 0; font-weight: 900; }
    .feedback-desc { color: #374151; font-size: 18px; line-height: 1.6; font-weight: 500;}
    .btn { background: #3B82F6; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; transition: transform 0.2s;}
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <!-- Panel Soal di Layar Kaca -->
  <div class="ui-container">
    <div class="question-box">
      <div id="level-badge" class="level-badge">Level 1</div>
      <h2 id="question-text">Memuat pertanyaan...</h2>
      <p id="question-type" class="q-type">Pilih Jawaban Benar</p>
    </div>
  </div>

  <!-- Popup Pembahasan Jika Salah -->
  <div id="feedback-modal" class="feedback-modal">
    <h3 class="feedback-title">Kurang Tepat!</h3>
    <p id="feedback-desc" class="feedback-desc"></p>
    <button class="btn" onclick="nextQuestion()">Paham, Lanjut Soal Berikutnya</button>
  </div>

  <!-- Area Kamera & AR -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse">
    <a-marker preset="hiro">
      <a-entity id="answers-container" position="0 1 -2"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Data Soal (Sampel mewakili PG, PG Kompleks, Benar-Salah)
    const questions = [
      { 
        id: 1, type: "PG", level: "L1 (Memahami)", 
        q: "Manakah gaya yang menyebabkan klip kertas bisa terapung di permukaan air meskipun massa jenisnya lebih besar dari air?", 
        options: ["Archimedes", "Tegangan Permukaan", "Kapilaritas"], 
        correct: 1, 
        expl: "Tegangan permukaan terjadi karena resultan gaya kohesi antarmolekul air di permukaan mengarah ke dalam, sehingga air bertindak seperti selaput yang teregang." 
      },
      { 
        id: 2, type: "PGK", level: "L3 (Analisis & Evaluasi)", 
        q: "Pilih faktor yang memengaruhi besar gaya apung (Hukum Archimedes) pada kapal laut:", 
        options: ["Massa jenis fluida & Volume tercelup", "Massa jenis kapal & Volume total", "Kedalaman laut & Massa kapal"], 
        correct: 0, 
        expl: "Sesuai rumus FA = ρ.g.V, gaya apung hanya dipengaruhi oleh massa jenis fluida (air laut) dan volume benda yang masuk (tercelup) ke dalam air." 
      },
      { 
        id: 3, type: "BS", level: "L2 (Penerapan)", 
        q: "Urutan Benar/Salah:\n1. Debit air mengecil saat lewat pipa sempit.\n2. Dongkrak hidrolik memperbesar gaya.\n3. Kecepatan aliran air (v) di pipa kecil lebih besar.", 
        options: ["Benar - Salah - Benar", "Salah - Benar - Benar", "Benar - Benar - Salah"], 
        correct: 1, 
        expl: "1. Salah: Debit air selalu konstan (Hukum Kontinuitas). 2. Benar: Hukum Pascal memperbesar gaya. 3. Benar: Penampang menyempit membuat laju bertambah cepat." 
      }
    ];

    let currentQ = 0;

    function renderQuestion() {
      const qData = questions[currentQ];
      document.getElementById('question-text').innerText = qData.q;
      document.getElementById('level-badge').innerText = qData.level;
      
      let typeText = "Klik Lebah dengan 1 Jawaban Benar";
      if(qData.type === "PGK") typeText = "Klik Lebah dengan Kombinasi Jawaban Tepat";
      if(qData.type === "BS") typeText = "Klik Lebah dengan Urutan Benar-Salah";
      document.getElementById('question-type').innerText = typeText;

      const container = document.getElementById('answers-container');
      container.innerHTML = '';

      qData.options.forEach((opt, index) => {
        const offset = (index - Math.floor(qData.options.length / 2)) * 1.8; 
        const beeEl = document.createElement('a-entity');
        
        // Merakit Lebah 3D menggunakan bentuk dasar A-Frame
        beeEl.innerHTML = `
          <!-- Badan -->
          <a-sphere color="#FBBF24" radius="0.4" scale="1 1 1.4"></a-sphere>
          <!-- Garis Hitam -->
          <a-cylinder color="#111827" radius="0.41" height="0.12" rotation="90 0 0" position="0 0 0.15"></a-cylinder>
          <a-cylinder color="#111827" radius="0.41" height="0.12" rotation="90 0 0" position="0 0 -0.15"></a-cylinder>
          <!-- Kepala & Mata -->
          <a-sphere color="#FBBF24" radius="0.25" position="0 0.1 0.55"></a-sphere>
          <a-sphere color="white" radius="0.08" position="0.1 0.18 0.7"></a-sphere>
          <a-sphere color="black" radius="0.03" position="0.1 0.18 0.77"></a-sphere>
          <a-sphere color="white" radius="0.08" position="-0.1 0.18 0.7"></a-sphere>
          <a-sphere color="black" radius="0.03" position="-0.1 0.18 0.77"></a-sphere>
          <!-- Sayap & Sengat -->
          <a-sphere color="#BAE6FD" opacity="0.7" radius="0.3" scale="1 0.05 0.5" position="0.25 0.35 0" rotation="0 30 0"></a-sphere>
          <a-sphere color="#BAE6FD" opacity="0.7" radius="0.3" scale="1 0.05 0.5" position="-0.25 0.35 0" rotation="0 -30 0"></a-sphere>
          <a-cone color="#111827" radius-bottom="0.08" height="0.25" position="0 0 -0.6" rotation="90 0 0"></a-cone>
        `;

        beeEl.setAttribute('scale', '0.5 0.5 0.5');
        
        // Animasi lebah turun membawa papan jawaban
        beeEl.setAttribute('animation', `property: position; from: ${offset} 4 -3; to: ${offset} 0.5 -1.5; dur: ${4000 + (index * 800)}; loop: true; dir: alternate; easing: easeInOutSine;`);
        
        // Papan teks jawaban
        const textEl = document.createElement('a-text');
        textEl.setAttribute('value', opt);
        textEl.setAttribute('position', `0 -1.2 0`);
        textEl.setAttribute('align', 'center');
        textEl.setAttribute('color', '#000000');
        textEl.setAttribute('width', '5');
        textEl.setAttribute('font', 'mozillavr');
        
        const planeEl = document.createElement('a-plane');
        planeEl.setAttribute('color', 'white');
        planeEl.setAttribute('width', '2.2');
        planeEl.setAttribute('height', '0.6');
        planeEl.setAttribute('position', '0 -1.2 -0.1');
        planeEl.setAttribute('opacity', '0.9');

        beeEl.appendChild(planeEl);
        beeEl.appendChild(textEl);

        beeEl.setAttribute('class', 'clickable');
        beeEl.addEventListener('click', () => checkAnswer(index, qData));
        container.appendChild(beeEl);
      });
    }

    function checkAnswer(selectedIndex, qData) {
      if(selectedIndex === qData.correct) {
        alert("Luar Biasa! Jawaban Tepat Sekali.");
        nextQuestion();
      } else {
        document.getElementById('feedback-modal').style.display = 'block';
        document.getElementById('feedback-desc').innerText = qData.expl;
      }
    }

    function nextQuestion() {
      document.getElementById('feedback-modal').style.display = 'none';
      currentQ++;
      if(currentQ < questions.length) {
        renderQuestion();
      } else {
        document.getElementById('question-text').innerText = "Hebat! Semua soal telah diselesaikan.";
        document.getElementById('question-type').innerText = "Silakan kembali ke menu materi di LMS.";
        document.getElementById('level-badge').style.display = 'none';
        document.getElementById('answers-container').innerHTML = '';
      }
    }

    window.onload = renderQuestion;
  </script>
</body>
</html>
